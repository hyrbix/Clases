<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HYBRIX · Clases</title>
<meta name="theme-color" content="#121416">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYBRIX Clases">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login">
  <div class="box">
    <div>
      <div class="bigwm">HYBRI<span>X</span></div>
      <div class="eyebrow">Planificador de clases para gyms Hyrox</div>
    </div>

    <div id="loading" class="row"><div class="spin" aria-hidden="true"></div><span class="note" id="loadingTxt">Revisando tu acceso…</span></div>

    <form id="form" class="card" hidden>
      <h2>Entrar</h2>
      <label class="field"><span>Correo</span><input id="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="field"><span>Contraseña</span><input id="pass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" id="go" type="submit">Entrar</button>
      <p class="msg bad" id="err" role="alert" hidden></p>
      <p class="note" id="iosTip" hidden>Primero agrega esta página a tu pantalla de inicio (Compartir → "Agregar a pantalla de inicio") y entra desde ese ícono. Tu cuenta queda ligada al lugar donde entres la primera vez.</p>
    </form>

    <div id="blocked" class="card" hidden>
      <h2 id="bTitle">Acceso <em>bloqueado</em></h2>
      <p id="bText"></p>
      <p class="note" id="bContact"></p>
      <button class="btn" type="button" id="bBack">Entrar con otra cuenta</button>
    </div>
  </div>
</main>

<script>
// Si algo no carga en 12 s, avisa en vez de quedarse girando
setTimeout(function(){var l=document.getElementById("loading");if(l&&!l.hidden){l.innerHTML='<p class="msg bad">No se pudo cargar. Cierra la pestaña y vuelve a abrir la página. Si sigue igual, espera 10 minutos (GitHub tarda en actualizar).</p>';}},12000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as CFG from "./config.js?v=4";
const firebaseConfig = CFG.firebaseConfig, CONTACTO = CFG.CONTACTO || "", ADMIN_EMAILS = CFG.ADMIN_EMAILS || [];

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- Identificador único de este dispositivo ----------
function deviceId(){
  let id = null;
  try { id = localStorage.getItem("hybrix-device"); } catch(e){}
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)) ;
    try { localStorage.setItem("hybrix-device", id); } catch(e){}
  }
  return id;
}
function deviceName(){
  const ua = navigator.userAgent;
  const d = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Otro";
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  return d + (standalone ? " · app" : " · navegador");
}

// ---------- Pantallas ----------
function showForm(msg){
  $("loading").hidden = true; $("blocked").hidden = true; $("form").hidden = false;
  $("err").hidden = !msg; $("err").textContent = msg || "";
  $("go").disabled = false;
  const ios = /iPhone|iPad/.test(navigator.userAgent);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  $("iosTip").hidden = !(ios && !standalone);
}
function showBlocked(title, text){
  $("loading").hidden = true; $("form").hidden = true; $("blocked").hidden = false;
  $("bTitle").innerHTML = title; $("bText").textContent = text;
  $("bContact").textContent = "¿Necesitas ayuda? " + CONTACTO;
}
$("bBack").addEventListener("click", async () => { await signOut(auth); showForm(); });

// ---------- Salir ----------
const params = new URLSearchParams(location.search);
if(params.has("salir")){
  await signOut(auth).catch(()=>{});
  history.replaceState(null, "", location.pathname);
}

// ---------- Login ----------
$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("go").disabled = true; $("err").hidden = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
  } catch(e){
    const c = e.code || "";
    showForm(c.includes("too-many") ? "Demasiados intentos. Espera unos minutos y vuelve a intentar."
      : c.includes("network") ? "No hay internet. Revisa tu conexión."
      : "Correo o contraseña incorrectos.");
  }
});

// ---------- Revisión de acceso ----------
let checking = false;
onAuthStateChanged(auth, async user => {
  if(!user){ showForm(); return; }
  if(checking) return; checking = true;
  $("form").hidden = true; $("loading").hidden = false; $("loadingTxt").textContent = "Revisando tu acceso…";
  try {
    // El administrador (tú) entra gratis y sin candado de dispositivo
    if(ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((user.email||"").toLowerCase())){
      $("loadingTxt").textContent = "Abriendo el planificador…";
      const a = await getDoc(doc(db, "app", "main"));
      if(!a.exists()){ checking=false; return showBlocked("Sin <em>publicar</em>", "Todavía no publicas el planificador. Entra a admin.html y súbelo en \"Publicar planificador\"."); }
      return openPlanner(a.data().html, "");
    }
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()){ await signOut(auth); checking=false; return showBlocked("Cuenta <em>sin alta</em>", "Tu cuenta todavía no está activada."); }
    const u = snap.data();
    const exp = u.expires && u.expires.toDate ? u.expires.toDate() : null;
    if(!u.active){ await signOut(auth); checking=false; return showBlocked("Acceso <em>pausado</em>", "Tu cuenta está desactivada."); }
    if(exp && exp < new Date()){ await signOut(auth); checking=false; return showBlocked("Acceso <em>vencido</em>", "Tu suscripción venció el " + exp.toLocaleDateString("es-MX") + ". Renueva para seguir usando HYBRIX."); }

    const mine = deviceId();
    if(!u.deviceId){
      await updateDoc(ref, { deviceId: mine, deviceAt: serverTimestamp(), deviceName: deviceName() });
    } else if(u.deviceId !== mine){
      await signOut(auth); checking=false;
      return showBlocked("Otro <em>dispositivo</em>", "Esta cuenta ya está ligada a otro dispositivo (" + (u.deviceName || "otro equipo") + "). Cada cuenta funciona en un solo dispositivo. Si cambiaste de teléfono, pide que liberen tu cuenta.");
    }
    updateDoc(ref, { lastSeen: serverTimestamp() }).catch(()=>{});

    $("loadingTxt").textContent = "Abriendo el planificador…";
    const appSnap = await getDoc(doc(db, "app", "main"));
    if(!appSnap.exists()){ checking=false; return showBlocked("En <em>mantenimiento</em>", "El planificador todavía no está publicado. Intenta en unos minutos."); }
    openPlanner(appSnap.data().html, u.gym || "");
  } catch(e){
    console.error(e);
    checking = false;
    const denied = String(e.code||"").includes("permission");
    showBlocked(denied ? "Acceso <em>bloqueado</em>" : "Sin <em>conexión</em>",
      denied ? "Tu cuenta no tiene permiso para entrar." : "No pudimos revisar tu acceso. Revisa tu internet y vuelve a abrir la app.");
  }
});

// ---------- Abre el planificador ----------
function openPlanner(html, gym){
  const pre = `<script>try{if(!localStorage.getItem('hybrix-planner2')&&${JSON.stringify(gym)})localStorage.setItem('hybrix-planner2',JSON.stringify({gym:${JSON.stringify(gym)}}));}catch(e){}<\/script>`;
  const out = `<a href="./?salir=1" style="position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:#121416;color:#fff;font:600 13px system-ui,sans-serif;padding:8px 14px;border-radius:999px;text-decoration:none;opacity:.85">Salir</a>`;
  let h = html.replace(/<head>/i, "<head>" + pre);
  h = h.replace(/<\/body>/i, out + "</body>");
  document.open(); document.write(h); document.close();
}
</script>
</body>
</html>
